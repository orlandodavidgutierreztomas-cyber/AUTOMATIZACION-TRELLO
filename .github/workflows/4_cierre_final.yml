# ===========================================================================
#  ROBOT 4 - Cierre definitivo del dia
# ---------------------------------------------------------------------------
#  LA HORA NO SE CAMBIA AQUI. El cron de abajo solo despierta el proceso cada
#  media hora; quien decide si de verdad toca ejecutar es el PORTERO, que lee
#  la hora de configuracion.json.
#  Para cambiarla: Actions -> "Configurar" -> Run workflow.
#
#  Los minutos 7 y 37 son a proposito: GitHub retrasa o descarta las tareas
#  programadas en punto y a la media, que son las horas de mayor congestion.
#  Este cron es la RED DE SEGURIDAD; el reloj puntual es el servicio externo,
#  que dispara este mismo workflow por la API a la hora configurada.
# ===========================================================================
name: 4. Cierre definitivo

on:
  schedule:
    - cron: "7,37 22-23 * * 1-5"
    - cron: "7,37 0-6 * * 2-6"
  workflow_dispatch:
    inputs:
      criterio:
        description: "Cuando cuenta como terminada"
        required: false
        default: "configurado"
        type: choice
        options: [configurado, checklist, auto, marcada]
      dry_run:
        description: "Solo mostrar que haria, sin tocar nada"
        required: false
        default: false
        type: boolean

concurrency:
  group: cierre-final
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cierre_final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # El portero solo interviene en las corridas automaticas de GitHub.
      # Un disparo externo o manual se ejecuta siempre, sin preguntar la hora.
      - name: Comprobar si toca ejecutar
        id: portero
        if: github.event_name == 'schedule'
        env:
          TZ_OBRA: ${{ vars.TZ_OBRA }}
          HORA_CIERRE_FINAL: ${{ vars.HORA_CIERRE_FINAL }}
          DIAS_HABILES: ${{ vars.DIAS_HABILES }}
        run: python -m trello_auto.portero --tarea cierre_final

      - name: Cierre definitivo
        if: github.event_name != 'schedule' || steps.portero.outputs.ejecutar == 'true'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          BOARD_ID: ${{ vars.BOARD_ID }}
          TZ_OBRA: ${{ vars.TZ_OBRA }}
          CRITERIO: ${{ inputs.criterio }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--fase final)
          if [ -n "${CRITERIO:-}" ] && [ "$CRITERIO" != "configurado" ]; then
            ARGS+=(--criterio "$CRITERIO")
          fi
          if [ "${DRY_RUN:-}" = "true" ]; then ARGS+=(--dry-run); fi
          echo "python -m trello_auto.cierre ${ARGS[@]+"${ARGS[@]}"}"
          python -m trello_auto.cierre ${ARGS[@]+"${ARGS[@]}"}

      - name: No tocaba ejecutar
        if: github.event_name == 'schedule' && steps.portero.outputs.ejecutar != 'true'
        run: |
          echo "Corrida omitida: ${{ steps.portero.outputs.motivo }}"
          echo "Hora configurada: ${{ steps.portero.outputs.hora }}"
