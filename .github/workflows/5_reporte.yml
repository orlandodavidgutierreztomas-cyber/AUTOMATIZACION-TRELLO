# ===========================================================================
#  ROBOT 5 - Reporte de control
# ---------------------------------------------------------------------------
#  LA HORA NO SE CAMBIA AQUI. El cron de abajo solo despierta el proceso cada
#  media hora; quien decide si de verdad toca ejecutar es el PORTERO, que lee
#  la hora de configuracion.json.
#  Para cambiarla: Actions -> "Configurar" -> Run workflow.
#
#  Los minutos 7 y 37 son a proposito: GitHub retrasa o descarta las tareas
#  programadas en punto y a la media, que son las horas de mayor congestion.
#  Este cron es la RED DE SEGURIDAD; el reloj puntual es el servicio externo,
#  que dispara este mismo workflow por la API a la hora configurada.
# ===========================================================================
name: 5. Reporte de control

on:
  schedule:
    - cron: "7,37 12-23 * * 1-5"
  workflow_dispatch:
    inputs:
      alcance:
        description: "Que tarjetas entran en el corte"
        required: false
        default: "dia"
        type: choice
        options: [dia, no-cumplidas, todo]
      dry_run:
        description: "Solo mostrar que haria, sin tocar nada"
        required: false
        default: false
        type: boolean

concurrency:
  group: reporte
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reporte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # El portero solo interviene en las corridas automaticas de GitHub.
      # Un disparo externo o manual se ejecuta siempre, sin preguntar la hora.
      - name: Comprobar si toca ejecutar
        id: portero
        if: github.event_name == 'schedule'
        env:
          TZ_OBRA: ${{ vars.TZ_OBRA }}
          HORA_REPORTE: ${{ vars.HORA_REPORTE }}
          DIAS_HABILES: ${{ vars.DIAS_HABILES }}
        run: python -m trello_auto.portero --tarea reporte

      - name: Reporte de control
        if: github.event_name != 'schedule' || steps.portero.outputs.ejecutar == 'true'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          BOARD_ID: ${{ vars.BOARD_ID }}
          TZ_OBRA: ${{ vars.TZ_OBRA }}
          ALCANCE: ${{ inputs.alcance }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--alcance "${ALCANCE:-dia}")
          if [ "${DRY_RUN:-}" = "true" ]; then ARGS+=(--dry-run); fi
          echo "python -m trello_auto.reporte ${ARGS[@]+"${ARGS[@]}"}"
          python -m trello_auto.reporte ${ARGS[@]+"${ARGS[@]}"}

      - name: Guardar el corte en el repositorio
        if: (github.event_name != 'schedule' || steps.portero.outputs.ejecutar == 'true') && inputs.dry_run != true
        run: |
          set -euo pipefail
          if git diff --quiet -- reportes/; then
            echo "El corte no cambio nada."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reportes/
          git commit -m "Corte de control $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main
          git push

      - name: No tocaba ejecutar
        if: github.event_name == 'schedule' && steps.portero.outputs.ejecutar != 'true'
        run: |
          echo "Corrida omitida: ${{ steps.portero.outputs.motivo }}"
          echo "Hora configurada: ${{ steps.portero.outputs.hora }}"
