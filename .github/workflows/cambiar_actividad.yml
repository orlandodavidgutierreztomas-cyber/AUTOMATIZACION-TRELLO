# ===========================================================================
#  CAMBIAR UNA ACTIVIDAD - corregir el mapeo sin descargar ni subir nada
# ---------------------------------------------------------------------------
#  Para las dos o tres excepciones que uno encuentra al revisar. Escribes un
#  trozo del nombre de la actividad y eliges familia y lista de un desplegable.
#
#  NO hace falta escribir la actividad exacta: acepta un trozo ("acero
#  inferior"), ignora acentos y mayusculas, y si no acierta te sugiere las
#  parecidas EN VEZ de aplicar un cambio equivocado.
#
#  Para muchos cambios de golpe sigue siendo mejor el cuadro Excel
#  ("Sincronizar" lo genera, "Aplicar mapeo revisado" lo aplica).
#
#  Para ver el mapeo entero: la pagina "Mapeo de actividades" de GitHub Pages.
# ===========================================================================
name: Cambiar una actividad del mapeo

on:
  workflow_dispatch:
    inputs:
      actividad:
        description: "Actividad (basta un trozo del nombre, ej: acero inferior)"
        required: true
      familia:
        description: "Familia nueva (vacio = no la cambia)"
        required: false
        default: ""
        type: choice
        options: ["", Acero, Encofrado, Concreto, Trazo, Relleno, Excavacion, Varios]
      lista:
        description: "Lista destino (vacio = la que corresponda a la familia)"
        required: false
        default: ""
      dry_run:
        description: "Solo mostrar el cambio, sin guardarlo"
        required: false
        default: false
        type: boolean

concurrency:
  group: mapeo

permissions:
  contents: write

jobs:
  cambiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cambiar la actividad
        id: cambio
        env:
          FAMILIA: ${{ inputs.familia }}
          LISTA: ${{ inputs.lista }}
        run: |
          set -euo pipefail
          ARGS=(--cambiar "${{ inputs.actividad }}")
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          python -m trello_auto.revisar "${ARGS[@]}"

      - name: Guardar el cambio
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          if git diff --quiet -- mapeo.json docs/; then
            echo "Nada cambio."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapeo.json docs/
          git commit -m "Mapeo: ${{ steps.cambio.outputs.resumen }}"
          git pull --rebase --autostash origin main
          git push

      - name: Resumen
        run: |
          {
            echo "### Mapeo actualizado"
            echo ""
            echo "${{ steps.cambio.outputs.resumen }}"
            echo ""
            echo "La pagina **Mapeo de actividades** ya refleja el cambio."
            echo "Desde la proxima corrida de **Preparar**, esa actividad ira"
            echo "a la lista que acabas de elegir."
          } >> "$GITHUB_STEP_SUMMARY"
