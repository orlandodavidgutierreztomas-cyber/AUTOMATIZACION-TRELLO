# ===========================================================================
#  CAMBIAR HORARIO  -  ajusta las horas SIN tocar el codigo
# ---------------------------------------------------------------------------
#  Actions -> "3. Cambiar horario" -> Run workflow -> escribe las horas nuevas.
#
#  El workflow guarda lo que escribas en el archivo horario.json del repo y
#  hace el commit por ti. Desde la siguiente corrida, TODO (la creacion
#  automatica, el cierre y las horas de las tarjetas) usa esas horas.
#
#  Deja en blanco lo que no quieras cambiar.
# ===========================================================================
name: 3. Cambiar horario

on:
  workflow_dispatch:
    inputs:
      hora_crear:
        description: "Hora a la que se CREAN las tarjetas (HH:MM, hora de la obra)"
        required: false
        default: ""
      hora_cierre:
        description: "Hora del CIERRE del dia (HH:MM)"
        required: false
        default: ""
      hora_inicio:
        description: "Hora de INICIO de cada tarjeta (HH:MM)"
        required: false
        default: ""
      hora_fin:
        description: "Hora de FIN / vencimiento de cada tarjeta (HH:MM)"
        required: false
        default: ""
      dias_habiles:
        description: 'Dias que corre, 1=lunes ... 7=domingo (ej. "1-5" o "1,3,5")'
        required: false
        default: ""
      tz_obra:
        description: 'Zona horaria de la obra (ej. "America/Lima")'
        required: false
        default: ""

concurrency:
  group: cambiar-horario

permissions:
  contents: write          # necesario para guardar horario.json en el repo

jobs:
  cambiar-horario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guardar el horario nuevo
        id: guardar
        env:
          HORA_CREAR: ${{ inputs.hora_crear }}
          HORA_CIERRE: ${{ inputs.hora_cierre }}
          HORA_INICIO: ${{ inputs.hora_inicio }}
          HORA_FIN: ${{ inputs.hora_fin }}
          DIAS_HABILES: ${{ inputs.dias_habiles }}
          TZ_OBRA: ${{ inputs.tz_obra }}
        run: python -m trello_auto.guardar_horario

      - name: Confirmar el cambio en el repositorio
        run: |
          set -euo pipefail
          if git diff --quiet -- horario.json; then
            echo "No hubo cambios que guardar."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add horario.json
          git commit -m "Cambio de horario: ${{ steps.guardar.outputs.resumen }}"
          git push

      - name: Resumen
        run: |
          {
            echo "### Horario actualizado"
            echo ""
            echo '```json'
            cat horario.json
            echo '```'
            echo ""
            echo "Se aplica desde la proxima corrida automatica."
          } >> "$GITHUB_STEP_SUMMARY"
