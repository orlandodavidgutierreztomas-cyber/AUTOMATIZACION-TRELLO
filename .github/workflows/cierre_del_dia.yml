# ===========================================================================
#  CIERRE DEL DIA  -  reloj automatico en GitHub Actions
# ---------------------------------------------------------------------------
#  Al final de la jornada mueve las tarjetas del dia:
#    terminadas -> CULMINADO   ·   no terminadas -> NO CUMPLIDAS
#
#  Igual que el otro workflow: el cron solo despierta el proceso; la hora real
#  la decide el PORTERO leyendo horario.json (HORA_CIERRE).
#  Para cambiarla usa el workflow "Cambiar horario" (Run workflow).
# ===========================================================================
name: 2. Cierre del dia

on:
  schedule:
    # Cada 30 min de 21:07 a 23:37 UTC (16:07-18:37 Peru) ...
    - cron: "7,37 21-23 * * 1-5"
    # ... y de 00:07 a 04:37 UTC del dia siguiente (19:07-23:37 Peru).
    - cron: "7,37 0-4 * * 2-6"
    # Minutos 7 y 37 a proposito: GitHub descarta tareas programadas en punto
    # y a la media, que son las horas de mayor congestion.

  workflow_dispatch:
    inputs:
      criterio:
        description: "Cuando se considera TERMINADA una tarjeta"
        required: false
        default: "configurado"
        type: choice
        options:
          - configurado   # el de settings.py: checklist 100% marcado
          - checklist     # todos los items del checklist marcados
          - auto          # checklist completo O tarjeta marcada como completa
          - marcada       # solo la marca de completa de Trello
      dry_run:
        description: "Solo mostrar que moveria, sin mover nada"
        required: false
        default: false
        type: boolean

concurrency:
  group: cierre-del-dia
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cierre-del-dia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar si toca ejecutar
        id: portero
        if: github.event_name == 'schedule'
        env:
          TZ_OBRA: ${{ vars.TZ_OBRA }}
          HORA_CIERRE: ${{ vars.HORA_CIERRE }}
          DIAS_HABILES: ${{ vars.DIAS_HABILES }}
        run: python -m trello_auto.portero --tarea cierre

      - name: Cerrar el dia
        if: github.event_name != 'schedule' || steps.portero.outputs.ejecutar == 'true'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          BOARD_ID: ${{ vars.BOARD_ID }}
          TZ_OBRA: ${{ vars.TZ_OBRA }}
          CRITERIO: ${{ inputs.criterio }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          # "configurado" (o vacio, en las corridas automaticas) = usar el de settings.py
          if [ -n "${CRITERIO:-}" ] && [ "${CRITERIO}" != "configurado" ]; then
            ARGS+=(--criterio "$CRITERIO")
          fi
          if [ "${DRY_RUN:-}" = "true" ]; then ARGS+=(--dry-run); fi
          python -m trello_auto.cierre_del_dia ${ARGS[@]+"${ARGS[@]}"}

      - name: No tocaba ejecutar
        if: github.event_name == 'schedule' && steps.portero.outputs.ejecutar != 'true'
        run: |
          echo "Corrida omitida: ${{ steps.portero.outputs.motivo }}"
          echo "Hora configurada para el cierre: ${{ steps.portero.outputs.hora }}"
