# ============================================================
#  RELOJ AUTOMÁTICO — GitHub Actions
#  Corre el script cada día y crea las tarjetas del día en Trello.
# ============================================================
name: Crear tarjetas Trello del día

# --- CUÁNDO SE EJECUTA ---
on:
  schedule:
    # Cron en horario UTC. Perú es UTC-5.
    # "30 11 * * 1-5" = 11:30 UTC = 6:30 a.m. Perú, de lunes a viernes.
    - cron: "30 11 * * 1-5"
  # Permite dispararlo a mano desde la pestaña Actions (botón "Run workflow").
  # Al hacerlo puedes escribir una fecha; si la dejas en "hoy", usa el día actual.
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha a crear (formato AAAA-MM-DD) o la palabra hoy'
        required: false
        default: 'hoy'

jobs:
  crear-tarjetas:
    runs-on: ubuntu-latest
    steps:
      # 1) Descarga tu repositorio (script + Excel) al servidor temporal
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      # 2) Instala Python
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3) Instala las dependencias
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # 4) Ejecuta el script para la fecha elegida (o HOY por defecto)
      #    Las credenciales llegan desde GitHub Secrets (no están en el código).
      - name: Crear tarjetas del día
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          RUTA_EXCEL: "5__LPS_PLANNING_REV_9.xlsx"
          FECHA_INPUT: ${{ github.event.inputs.fecha }}
        run: python crear_tarjetas.py --fecha "${FECHA_INPUT:-hoy}"
