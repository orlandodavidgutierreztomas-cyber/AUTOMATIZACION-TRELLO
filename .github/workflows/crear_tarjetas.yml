# ===========================================================================
#  CREAR TARJETAS DEL DIA  -  reloj automatico en GitHub Actions
# ---------------------------------------------------------------------------
#  Corre solo, en la nube, y crea las tarjetas del dia en Trello.
#  Tambien se puede disparar a mano (Actions -> Run workflow) con parametros
#  propios: otra fecha, un rango, un solo tipo de trabajo, u otro horario.
#
#  LA HORA NO SE CAMBIA AQUI. El cron de abajo solo "despierta" el workflow
#  cada media hora; quien decide si de verdad toca ejecutar es el PORTERO
#  (trello_auto/portero.py), que lee la hora de horario.json.
#  Para cambiar la hora usa el workflow "Cambiar horario" (Run workflow).
# ===========================================================================
name: 1. Crear tarjetas del dia

on:
  schedule:
    # Cada 30 min entre las 09:07 y las 17:37 UTC, de lunes a viernes.
    # Cubre cualquier hora de creacion entre las 04:00 y las 12:30 en Peru.
    #
    # OJO con los minutos 7 y 37: GitHub retrasa o DESCARTA las tareas
    # programadas cuando hay mucha carga, y la hora en punto (:00) y la media
    # (:30) son los momentos de mayor congestion. Por eso NO se programa ahi.
    #
    # El portero deja pasar las citas de la ventana que abre a la hora
    # configurada. Si GitHub dispara varias, no pasa nada: crear tarjetas es
    # idempotente y la segunda corrida no duplica ninguna.
    - cron: "7,37 9-17 * * 1-5"

  workflow_dispatch:
    inputs:
      fecha:
        description: 'Fecha (AAAA-MM-DD) o la palabra "hoy"'
        required: false
        default: "hoy"
      fecha_fin:
        description: 'Fecha final del rango (AAAA-MM-DD). Vacio = solo "fecha"'
        required: false
        default: ""
      tipo:
        description: "Tipo de trabajo a crear"
        required: false
        default: "TODOS"
        type: choice
        options: [TODOS, ACERO, ENCOFRADO, CONCRETO, VARIOS]
      hora_inicio:
        description: "Hora de inicio de la jornada (HH:MM). Vacio = la configurada"
        required: false
        default: ""
      hora_fin:
        description: "Hora de fin / vencimiento (HH:MM). Vacio = la configurada"
        required: false
        default: ""
      dry_run:
        description: "Solo mostrar que crearia, sin crear nada"
        required: false
        default: false
        type: boolean

# Si una corrida sigue en marcha, no se pisan entre ellas.
concurrency:
  group: crear-tarjetas
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crear-tarjetas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # --- PORTERO: solo en las corridas automaticas -----------------------
      # Compara la hora actual de la obra con la hora configurada en
      # horario.json (o en la Variable HORA_CREAR del repositorio).
      - name: Comprobar si toca ejecutar
        id: portero
        if: github.event_name == 'schedule'
        env:
          TZ_OBRA: ${{ vars.TZ_OBRA }}
          HORA_CREAR: ${{ vars.HORA_CREAR }}
          DIAS_HABILES: ${{ vars.DIAS_HABILES }}
        run: python -m trello_auto.portero --tarea crear

      - name: Crear tarjetas
        if: github.event_name != 'schedule' || steps.portero.outputs.ejecutar == 'true'
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          BOARD_ID: ${{ vars.BOARD_ID }}
          TZ_OBRA: ${{ vars.TZ_OBRA }}
          # Las horas de la jornada: primero lo que se escribio en el boton,
          # si no, la Variable del repo, si no, horario.json / valor por defecto.
          HORA_INICIO: ${{ inputs.hora_inicio || vars.HORA_INICIO }}
          HORA_FIN: ${{ inputs.hora_fin || vars.HORA_FIN }}
          FECHA: ${{ inputs.fecha || 'hoy' }}
          FECHA_FIN: ${{ inputs.fecha_fin }}
          TIPO: ${{ inputs.tipo || 'TODOS' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--fecha "$FECHA" --tipo "$TIPO")
          if [ -n "$FECHA_FIN" ]; then ARGS+=(--fecha-fin "$FECHA_FIN"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          echo "python -m trello_auto.crear_tarjetas ${ARGS[*]}"
          python -m trello_auto.crear_tarjetas "${ARGS[@]}"

      - name: No tocaba ejecutar
        if: github.event_name == 'schedule' && steps.portero.outputs.ejecutar != 'true'
        run: |
          echo "Corrida omitida: ${{ steps.portero.outputs.motivo }}"
          echo "Hora configurada para crear tarjetas: ${{ steps.portero.outputs.hora }}"
