# ===========================================================================
#  MONTAR TABLERO - deja un tablero vacio listo para trabajar
# ---------------------------------------------------------------------------
#  Es el arranque de una obra nueva: con el cronograma subido y un tablero en
#  blanco, crea las columnas que el sistema necesita y una tarjeta PLANTILLA
#  por cada actividad del Excel, con un checklist por responsable ya montado.
#
#  Los items son GENERICOS a proposito: el objetivo no es acertar el protocolo
#  de cada actividad -eso lo sabe la obra- sino dejar el esqueleto puesto para
#  que solo haya que rellenarlo.
#
#  SOLO CREA LO QUE FALTA. Nada existente se toca, se renombra ni se borra,
#  asi que se puede correr las veces que haga falta (por ejemplo cuando el
#  cronograma incorpore actividades nuevas).
#
#  Empieza siempre con dry_run activado para ver la lista de lo que haria.
# ===========================================================================
name: Montar tablero desde el cronograma

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar que crearia, sin crear nada (recomendado la 1a vez)"
        required: false
        default: true
        type: boolean
      alcance:
        description: "Que montar"
        required: false
        default: "todo"
        type: choice
        options: [todo, solo-listas, solo-plantillas]

concurrency:
  group: montar-tablero

permissions:
  contents: read

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Montar el tablero
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          BOARD_ID: ${{ vars.BOARD_ID }}
          TZ_OBRA: ${{ vars.TZ_OBRA }}
        run: |
          set -euo pipefail
          ARGS=()
          case "${{ inputs.alcance }}" in
            solo-listas)     ARGS+=(--solo-listas) ;;
            solo-plantillas) ARGS+=(--solo-plantillas) ;;
          esac
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          python -m trello_auto.montar_tablero ${ARGS[@]+"${ARGS[@]}"} 2>&1 | tee salida.txt

      - name: Que paso
        if: always()
        run: |
          {
            echo "### Montar tablero"
            echo ""
            echo '```'
            tail -n 40 salida.txt 2>/dev/null || echo "(sin salida)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Siguiente paso
        if: success() && inputs.dry_run != true
        run: |
          {
            echo "### Tablero montado"
            echo ""
            echo "1. Revisa las plantillas nuevas en la lista **PLANTILLAS**."
            echo "2. Reescribe sus items con el control de calidad real."
            echo "3. Corre **Sincronizar** para que el mapeo las reconozca."
          } >> "$GITHUB_STEP_SUMMARY"
