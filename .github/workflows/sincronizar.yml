# ===========================================================================
#  SINCRONIZAR - relee el Excel y el tablero, y actualiza el mapeo
# ---------------------------------------------------------------------------
#  Apriétalo cuando:
#    - subas una revision nueva del Excel del cronograma,
#    - crees plantillas o listas nuevas en Trello.
#
#  Hace tres cosas y hace el commit por ti:
#    1. Saca del Excel todas las actividades distintas.
#    2. Vuelca el plan completo a data/plan_obra.json (el respaldo).
#    3. Lee el tablero y escribe mapeo.json PRE-RELLENADO, respetando lo que
#       tu hayas corregido a mano.
# ===========================================================================
name: Sincronizar cronograma y tablero

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo mostrar que haria, sin escribir nada"
        required: false
        default: false
        type: boolean

concurrency:
  group: sincronizar

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sincronizar
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          BOARD_ID: ${{ vars.BOARD_ID }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          python -m trello_auto.sincronizar ${ARGS[@]+"${ARGS[@]}"}

      - name: Guardar el mapeo y el respaldo
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          if git diff --quiet -- mapeo.json data/; then
            echo "Nada cambio."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapeo.json data/
          git commit -m "Sincronizacion del cronograma y el tablero"
          git pull --rebase --autostash origin main
          git push

      - name: Resumen
        run: |
          {
            echo "### Mapeo actualizado"
            echo ""
            echo "Revisa \`mapeo.json\`: si alguna actividad quedo en la familia"
            echo "equivocada, corrigela ahi y se respetara en las proximas"
            echo "sincronizaciones."
          } >> "$GITHUB_STEP_SUMMARY"
