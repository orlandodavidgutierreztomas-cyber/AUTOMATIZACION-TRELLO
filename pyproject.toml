[project]
name = "trello-automatizacion-obra"
version = "2.0.0"
description = "Automatizacion de tarjetas Trello desde el cronograma LPS de obra."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741", "UP009"]  # UP009: mantenemos la cabecera utf-8 por claridad

[tool.ruff.lint.per-file-ignores]
# tablero.py lleva el CSS del dashboard incrustado: sus lineas largas son
# hojas de estilo, no codigo, y partirlas lo haria menos legible.
"trello_auto/tablero.py" = ["E501"]
